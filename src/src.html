<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside Job</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Share+Tech+Mono&family=VT323&family=Caveat:wght@500;700&family=Patrick+Hand&family=Lilita+One&family=Nunito:wght@600;800&family=Chakra+Petch:wght@400;600&family=Press+Start+2P&family=Silkscreen&family=Righteous&family=Space+Mono:wght@400;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Bebas+Neue&family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c2f57;--panel:transparent;--ink:#e8f3ff;--muted:#9cc3ea;--accent:#7fe3ff;--danger:#ff5a6a;--good:#8dffb5;--line:#e8f3ff;--fh:'Architects Daughter',cursive;--fb:'Share Tech Mono',monospace;--btn:#e8f3ff;--btnink:#0c2f57}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);overflow:hidden;transition:background .4s}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh}
#top{display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap;border-bottom:1px solid color-mix(in srgb,var(--line) 30%,transparent)}
#top .ttl{font-family:var(--fh);font-size:22px;letter-spacing:.06em;white-space:nowrap}
#top .ttl small{font-family:var(--fb);font-size:12px;opacity:.7;letter-spacing:.02em;margin-left:8px}
#styles{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
#styles button{border:1px solid color-mix(in srgb,var(--line) 50%,transparent);background:transparent;padding:4px 10px;font-size:13px;border-radius:0}
#styles button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
#fsBtn,#mute{border:1px solid color-mix(in srgb,var(--line) 50%,transparent);background:transparent;padding:4px 9px;font-size:13px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:10px}
#cv{display:block;touch-action:none}
#side{width:330px;overflow-y:auto;padding:10px 12px 20px;display:flex;flex-direction:column;gap:10px;border-left:1px solid color-mix(in srgb,var(--line) 30%,transparent)}
.card{position:relative;padding:10px 12px;background:var(--panel)}
.card h3{margin:0 0 8px;font-family:var(--fh);font-weight:normal;font-size:18px;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px}
.card h3 small{font-family:var(--fb);font-size:11px;opacity:.65;margin-left:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat .v{font-size:22px;font-family:var(--fh)}
.meter{grid-column:1/3}
.bar{height:10px;border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--danger);width:0;transition:width .5s}
#tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{display:flex;align-items:center;gap:8px;padding:6px 8px;background:transparent;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);text-align:left;font-size:13px;line-height:1.1}
.tool svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool .c{display:block;font-size:11px;opacity:.75}
.tool kbd{margin-left:auto;font-size:10px;opacity:.55;font-family:var(--fb)}
.tool.on{background:var(--btn);color:var(--btnink)}
.tool:disabled{opacity:.35;cursor:not-allowed}
#toolHelp{font-size:12px;color:var(--muted);margin-top:8px;min-height:30px;line-height:1.35}
#selBtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#selBtns button,.small{border:1px solid color-mix(in srgb,var(--line) 50%,transparent);background:transparent;padding:4px 9px;font-size:12px}
.crew{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-top:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.crew:first-child{border-top:0}
.crew .dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:bold;color:#111;margin-top:2px}
.crew b{font-family:var(--fh);font-weight:normal;font-size:16px}
.crew .tag{display:inline-block;font-size:10px;padding:1px 5px;border:1px solid currentColor;margin-left:4px;letter-spacing:.08em;vertical-align:2px}
.crew .r{font-size:12px;color:var(--muted);line-height:1.35}
.crew.out{opacity:.45}
#routeDone{width:100%;margin-top:8px;padding:10px;font-family:var(--fh);font-size:17px;background:var(--btn);color:var(--btnink);border:0}
#routeDone[hidden]{display:none}
#go{width:100%;padding:12px;font-family:var(--fh);font-size:20px;letter-spacing:.06em;background:var(--btn);color:var(--btnink);border:0}
#go:disabled{opacity:.5}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.row .small.on{background:var(--btn);color:var(--btnink)}
#log{font-size:12px;line-height:1.45;max-height:150px;overflow:hidden;color:var(--muted)}
#log div{animation:fadein .4s}
#log b{color:var(--ink);font-weight:normal}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:5;padding:16px}
#overlay.show{display:flex}
#sheet{max-width:560px;width:100%;max-height:100%;overflow:auto;padding:26px 28px;position:relative;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
#sheet h1{font-family:var(--fh);font-weight:normal;margin:0 0 4px;font-size:40px;letter-spacing:.04em;line-height:1}
#sheet h2{font-family:var(--fh);font-weight:normal;margin:0 0 6px;font-size:28px}
#sheet p{line-height:1.5;font-size:14px}
#sheet .lines div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed color-mix(in srgb,currentColor 30%,transparent);font-size:14px}
#sheet .big{font-size:20px;font-family:var(--fh)}
#sheet .stamp{position:absolute;right:22px;top:20px;font-family:var(--fh);font-size:30px;padding:4px 12px;border:4px solid;transform:rotate(-12deg);opacity:.85;letter-spacing:.08em;animation:stamp .5s .25s both cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
#sheet .cta{margin-top:16px;width:100%;padding:12px;font-family:var(--fh);font-size:20px;background:var(--btn);color:var(--btnink);border:0}
#sheet .pick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
#sheet .pick button{border:1px solid currentColor;background:transparent;padding:5px 10px;font-size:13px}
#sheet .pick button.on{background:var(--btn);color:var(--btnink)}
#sheet ul{padding-left:18px;font-size:14px;line-height:1.5;margin:6px 0}
#toasts{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel);color:var(--ink);border:2px solid var(--accent);padding:8px 12px;max-width:290px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.35);transform:translateX(-120%);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.toast.in{transform:none}.toast b{display:block;font-family:var(--fh);font-size:16px;color:var(--accent)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:10px 0}.achs div{border:1px dashed var(--line);padding:7px 9px;font-size:12px;opacity:.45}.achs div.on{opacity:1;border-style:solid;border-color:var(--accent)}.achs b{display:block;font-size:14px}
#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:min(560px,90%);padding:9px 14px;font-size:13px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .4s;z-index:3;text-align:center}
#hint.show{opacity:1}

/* ---------- BLUEPRINT ---------- */
body[data-theme=blueprint]{--bg:#0c2f57;--ink:#eaf4ff;--muted:#9cc3ea;--accent:#7fe3ff;--danger:#ff6b78;--line:#d7ebff;--fh:'Architects Daughter',cursive;--fb:'Share Tech Mono',monospace;--btn:#eaf4ff;--btnink:#0c2f57;
 background-image:linear-gradient(rgba(170,210,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(170,210,255,.06) 1px,transparent 1px);background-size:20px 20px}
body[data-theme=blueprint] .card{border:1.5px dashed rgba(215,235,255,.55)}
body[data-theme=blueprint] .card h3{text-transform:uppercase;border-bottom:1px solid rgba(215,235,255,.35);padding-bottom:4px}
body[data-theme=blueprint] #sheet{background:#0f3a6b;border:2px solid #d7ebff;box-shadow:0 0 0 6px #0f3a6b,0 0 0 7px rgba(215,235,255,.5)}
body[data-theme=blueprint] #hint{background:#0f3a6b;border:1px dashed #d7ebff}

/* ---------- CCTV ---------- */
body[data-theme=cctv]{--bg:#000;--panel:#020c05;--ink:#6dffa3;--muted:#3fb46c;--accent:#b6ffcf;--danger:#ff4d4d;--line:#2fd06b;--fh:'VT323',monospace;--fb:'VT323',monospace;--btn:#6dffa3;--btnink:#001a08;font-size:17px}
body[data-theme=cctv] #app{text-shadow:0 0 6px rgba(80,255,140,.45)}
body[data-theme=cctv] .card{border:1px solid #1b7a3e;box-shadow:inset 0 0 18px rgba(40,255,120,.06)}
body[data-theme=cctv] .card h3{font-size:22px;text-transform:uppercase}
body[data-theme=cctv] .card h3:before{content:'■ ';color:var(--danger);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
body[data-theme=cctv] .tool{font-size:16px}
body[data-theme=cctv] #crew .r,body[data-theme=cctv] #log,body[data-theme=cctv] #toolHelp{font-size:15px}
body[data-theme=cctv] #side:after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.25) 2px 3px);z-index:9}
body[data-theme=cctv] #sheet{background:#010a04;border:1px solid #2fd06b;box-shadow:0 0 40px rgba(40,255,120,.2)}
body[data-theme=cctv] #hint{background:#010a04;border:1px solid #2fd06b}

/* ---------- SKETCH ---------- */
body[data-theme=sketch]{--bg:#d9cdb2;--panel:#fbf6e8;--ink:#2f2c27;--muted:#6e675b;--accent:#2c5aa0;--danger:#c8382b;--good:#3d7d3a;--line:#2f2c27;--fh:'Caveat',cursive;--fb:'Patrick Hand',cursive;--btn:#2f2c27;--btnink:#fbf6e8;font-size:15px;
 background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px);background-size:5px 5px}
body[data-theme=sketch] #top{background:#fbf6e8;border-bottom:2px solid #2f2c27}
body[data-theme=sketch] .card{box-shadow:2px 3px 0 rgba(0,0,0,.15);border:1.5px solid #2f2c27;border-radius:3px 6px 4px 7px/7px 3px 6px 4px}
body[data-theme=sketch] .card:nth-child(odd){transform:rotate(-.5deg)}
body[data-theme=sketch] .card:nth-child(even){transform:rotate(.4deg)}
body[data-theme=sketch] .card:before{content:'';position:absolute;top:-8px;left:50%;width:70px;height:16px;margin-left:-35px;background:rgba(240,220,140,.75);transform:rotate(-3deg);box-shadow:0 1px 1px rgba(0,0,0,.1)}
body[data-theme=sketch] .card h3{font-size:26px;font-weight:700}
body[data-theme=sketch] .stat .v{font-size:28px}
body[data-theme=sketch] .tool{border-radius:8px 3px 7px 4px/4px 7px 3px 8px;border:1.5px solid #2f2c27}
body[data-theme=sketch] #go{font-size:28px;border-radius:10px 4px 9px 5px/5px 9px 4px 10px}
body[data-theme=sketch] #sheet{background:#fbf6e8;color:#2f2c27;border:2px solid #2f2c27;box-shadow:5px 6px 0 rgba(0,0,0,.2);border-radius:6px 12px 8px 14px/14px 6px 12px 8px}
body[data-theme=sketch] #sheet h1{font-size:54px;font-weight:700}
body[data-theme=sketch] #hint{background:#fff7c2;color:#2f2c27;border:1px solid #c9b860;box-shadow:2px 3px 0 rgba(0,0,0,.15);font-size:15px;transform:translateX(-50%) rotate(-1deg)}

/* ---------- BOARD GAME ---------- */
body[data-theme=board]{--bg:#5b3720;--panel:#f3e6c6;--ink:#2b1d14;--muted:#7a5a3f;--accent:#2f6fd0;--danger:#d63c2f;--good:#2f8a3f;--line:#2b1d14;--fh:'Lilita One',cursive;--fb:'Nunito',sans-serif;--btn:#d63c2f;--btnink:#fff;font-weight:600;
 background-image:repeating-linear-gradient(92deg,rgba(0,0,0,.08) 0 3px,transparent 3px 11px),repeating-linear-gradient(88deg,rgba(255,255,255,.04) 0 2px,transparent 2px 17px)}
body[data-theme=board] #top{background:#2b1d14;color:#f3e6c6;border:0}
body[data-theme=board] #top .ttl{color:#ffcf4a;text-shadow:2px 2px 0 #000}
body[data-theme=board] #styles button,body[data-theme=board] #mute{border:2px solid #f3e6c6;border-radius:999px;color:#f3e6c6}
body[data-theme=board] #styles button.on{background:#ffcf4a;color:#2b1d14;border-color:#ffcf4a}
body[data-theme=board] #side{border:0}
body[data-theme=board] .card{border:3px solid #2b1d14;border-radius:12px;box-shadow:0 5px 0 #2b1d14}
body[data-theme=board] .card h3{font-size:20px;color:#2b1d14}
body[data-theme=board] .tool{border:2px solid #2b1d14;border-radius:9px;background:#fff8e6;box-shadow:0 3px 0 #2b1d14}
body[data-theme=board] .tool.on{background:#2f6fd0;color:#fff;transform:translateY(2px);box-shadow:0 1px 0 #2b1d14}
body[data-theme=board] #go{border-radius:12px;box-shadow:0 5px 0 #7c1d15;border:3px solid #2b1d14}
body[data-theme=board] .bar{border:2px solid #2b1d14;border-radius:999px;height:14px}
body[data-theme=board] #sheet{background:#f3e6c6;color:#2b1d14;border:4px solid #2b1d14;border-radius:18px;box-shadow:0 8px 0 #2b1d14}
body[data-theme=board] #sheet .cta{border-radius:12px;box-shadow:0 5px 0 #7c1d15}
body[data-theme=board] #hint{background:#ffcf4a;color:#2b1d14;border:3px solid #2b1d14;border-radius:12px;box-shadow:0 4px 0 #2b1d14}

/* ---------- THERMAL ---------- */
body[data-theme=thermal]{--bg:#06010d;--panel:rgba(30,8,50,.55);--ink:#ffe9c9;--muted:#c08cff;--accent:#ffb340;--danger:#ff3b5c;--good:#7dffd8;--line:#8a4dff;--fh:'Chakra Petch',sans-serif;--fb:'Share Tech Mono',monospace;--btn:linear-gradient(90deg,#ff3b5c,#ffb340);--btnink:#1a0426}
body[data-theme=thermal] #top{border-image:linear-gradient(90deg,#3b0a7a,#ff3b5c,#ffb340) 1}
body[data-theme=thermal] .card{border:1px solid transparent;background:linear-gradient(#12041f,#12041f) padding-box,linear-gradient(135deg,#5a1fd1,#ff3b5c 60%,#ffb340) border-box}
body[data-theme=thermal] .card h3{text-transform:uppercase;font-weight:600;letter-spacing:.14em;font-size:15px}
body[data-theme=thermal] #styles button.on,body[data-theme=thermal] .tool.on,body[data-theme=thermal] .small.on{background:linear-gradient(90deg,#ff3b5c,#ffb340);color:#1a0426;border-color:transparent}
body[data-theme=thermal] #go{background:linear-gradient(90deg,#ff3b5c,#ffb340);color:#1a0426;font-weight:600}
body[data-theme=thermal] .bar i{background:linear-gradient(90deg,#ffb340,#ff3b5c)}
body[data-theme=thermal] #sheet{background:#12041f;border:1px solid #ff3b5c;box-shadow:0 0 60px rgba(255,59,92,.25)}
body[data-theme=thermal] #sheet .cta{background:linear-gradient(90deg,#ff3b5c,#ffb340)}
body[data-theme=thermal] #hint{background:#12041f;border:1px solid #ffb340}

/* ---------- PIXEL ---------- */
body[data-theme=pixel]{--bg:#141022;--panel:#231c3a;--ink:#f4f0dc;--muted:#a99fd0;--accent:#ffd84a;--danger:#ff4f5e;--good:#6fe07a;--line:#f4f0dc;--fh:'Press Start 2P',monospace;--fb:'Silkscreen',monospace;--btn:#ffd84a;--btnink:#141022;font-size:13px;image-rendering:pixelated}
body[data-theme=pixel] .card{border:0;box-shadow:0 0 0 3px #141022,0 0 0 6px #f4f0dc,6px 6px 0 6px #000}
body[data-theme=pixel] .card h3{font-size:12px;line-height:1.5}
body[data-theme=pixel] .stat .v{font-size:15px;margin-top:4px}
body[data-theme=pixel] .tool,body[data-theme=pixel] .small,body[data-theme=pixel] #selBtns button{border:0;box-shadow:inset -3px -3px 0 rgba(0,0,0,.45),inset 3px 3px 0 rgba(255,255,255,.15);background:#3a2f5e}
body[data-theme=pixel] .tool.on,body[data-theme=pixel] .small.on{background:#ffd84a;color:#141022}
body[data-theme=pixel] #go{font-size:13px;box-shadow:inset -4px -4px 0 #b88c10;padding:14px}
body[data-theme=pixel] #top .ttl{font-size:16px}
body[data-theme=pixel] #sheet{background:#231c3a;box-shadow:0 0 0 4px #141022,0 0 0 8px #f4f0dc,10px 10px 0 8px #000}
body[data-theme=pixel] #sheet h1{font-size:28px;line-height:1.3}
body[data-theme=pixel] #sheet h2{font-size:16px;line-height:1.5}
body[data-theme=pixel] #sheet .big{font-size:14px}
body[data-theme=pixel] #sheet .stamp,body[data-theme=pixel] #sheet .cta{font-size:13px}
body[data-theme=pixel] #hint{background:#231c3a;box-shadow:0 0 0 3px #f4f0dc}
body[data-theme=pixel] .crew b{font-size:10px}

/* ---------- NEON NOIR ---------- */
body[data-theme=noir]{--bg:#05060c;--panel:rgba(10,12,28,.8);--ink:#e9ecff;--muted:#8b93c7;--accent:#3df2ff;--danger:#ff2e88;--good:#3dffb0;--line:#3df2ff;--fh:'Righteous',sans-serif;--fb:'Space Mono',monospace;--btn:#ff2e88;--btnink:#05060c;font-size:13px;
 background-image:radial-gradient(ellipse at 20% 0%,rgba(255,46,136,.16),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(61,242,255,.12),transparent 50%)}
body[data-theme=noir] #top{border-bottom:1px solid #ff2e88;box-shadow:0 1px 18px rgba(255,46,136,.4)}
body[data-theme=noir] #top .ttl{color:#ff2e88;text-shadow:0 0 12px #ff2e88,0 0 2px #fff}
body[data-theme=noir] .card{border:1px solid rgba(61,242,255,.5);box-shadow:0 0 14px rgba(61,242,255,.15),inset 0 0 14px rgba(61,242,255,.06)}
body[data-theme=noir] .card h3{color:#3df2ff;text-shadow:0 0 8px #3df2ff;text-transform:uppercase;letter-spacing:.12em;font-size:16px}
body[data-theme=noir] #go{box-shadow:0 0 22px rgba(255,46,136,.6);text-shadow:none}
body[data-theme=noir] #sheet{background:#0a0c1c;border:1px solid #ff2e88;box-shadow:0 0 50px rgba(255,46,136,.35)}
body[data-theme=noir] #sheet h1{color:#ff2e88;text-shadow:0 0 18px #ff2e88}
body[data-theme=noir] #hint{background:#0a0c1c;border:1px solid #3df2ff;box-shadow:0 0 14px rgba(61,242,255,.4)}

/* ---------- TERMINAL ---------- */
body[data-theme=term]{--bg:#0b0700;--panel:#120b00;--ink:#ffb000;--muted:#a87400;--accent:#ffd27a;--danger:#ff5a36;--good:#9dff6a;--line:#7a5400;--fh:'VT323',monospace;--fb:'Share Tech Mono',monospace;--btn:#ffb000;--btnink:#120b00;font-size:14px}
body[data-theme=term] #top{background:#120b00;border-bottom:1px solid #7a5400}
body[data-theme=term] #top .ttl{text-shadow:0 0 8px rgba(255,176,0,.7)}
body[data-theme=term] .card{border:1px solid #7a5400;border-radius:0;box-shadow:inset 0 0 18px rgba(255,176,0,.06)}
body[data-theme=term] .card h3{font-size:22px;text-shadow:0 0 6px rgba(255,176,0,.6)}
body[data-theme=term] .card h3::before{content:'> '}
body[data-theme=term] .tool{border:1px solid #7a5400;border-radius:0}
body[data-theme=term] #go{border-radius:0;font-family:'VT323';font-size:26px}
body[data-theme=term] #sheet{background:#120b00;color:#ffb000;border:1px solid #ffb000;border-radius:0;box-shadow:0 0 30px rgba(255,176,0,.2)}
body[data-theme=term] #hint{background:#120b00;color:#ffb000;border:1px solid #ffb000;border-radius:0}
/* ---------- WATERCOLOUR ---------- */
body[data-theme=water]{--bg:#f4efe6;--panel:#fbf8f2;--ink:#2d3a5a;--muted:#7d8499;--accent:#c4553f;--danger:#b8392b;--good:#4c8a6a;--line:#9aa3b8;--fh:'Caveat',cursive;--fb:'Nunito',sans-serif;--btn:#2d3a5a;--btnink:#fbf8f2;font-size:13px}
body[data-theme=water] #top{background:linear-gradient(90deg,rgba(90,120,180,.25),rgba(196,85,63,.2));color:#2d3a5a;border:0}
body[data-theme=water] #top .ttl{font-family:'Caveat';font-size:34px}

  if(g.state==='chase'||g.dazedT>0)continue;// anticipate where the patrol is heading
  const fut=(g.path&&g.path.length?g.path:[]).slice(0,7);if(!fut.length&&g.loopPath&&g.loopPath.length>1)fut.push(g.loopPath[(g.lp+1)%g.loopPath.length]);
  fut.forEach((fi,n)=>{const fx=tx(fi),fy=ty(fi);for(let y=fy-1;y<=fy+1;y++)for(let x=fx-1;x<=fx+1;x++){if(!inb(x,y))continue;const i=idx(x,y);if(c[i]===Infinity)continue;c[i]+=(n<4?5:3)*gm*(x===fx&&y===fy?1.5:1)}});

// ================================================================ PLACEMENT / INPUT
function deviceAt(i){return ST.devices.find(d=>d.i===i)}
function canPlace(type,i){
 if(i<0)return false;if(ST.cash<DEV[type].cost)return false;
 if(type==='steel')return G[i]===DOOR&&i!==VAULT_I&&!deviceAt(i);
 if(G[i]!==FLOOR)return false;if(ST.loot.some(l=>l.i===i))return false;if(deviceAt(i))return false;
 if(ENTRIES.some(e=>e.roof&&spawnI(e)===i))return false;
 if(type==='laser'&&laserBeam(tx(i),ty(i),autoOrient(tx(i),ty(i))).length>9)return false;
 return true;
}
function bestAim(x,y){let best=0,bv=-1;for(let k=0;k<16;k++){const a=k*Math.PI/8;let v=0;for(let yy=y-6;yy<=y+6;yy++)for(let xx=x-6;xx<=x+6;xx++){if(!inb(xx,yy))continue;const i=idx(xx,yy);if(!passable(i)||G[i]===OUT)continue;if(inCone(x+.5,y+.5,a,CAM.fov,CAM.range,xx+.5,yy+.5)>0)v+=1+(ST.loot.some(l=>l.i===i)?3:0)+(G[i]===DOOR||G[i]===ENTRY?2:0)}if(v>bv){bv=v;best=a}}return best}
let camN=1;
function place(type,i,opts={}){
 if(!canPlace(type,i)){AU.deny();return null}
 const d={id:ST.devId++,type,i,x:tx(i),y:ty(i),ang:0,sweep:true,phase:Math.random()*6.28,orient:'h',route:[],cur:0};
 if(type==='camera'){d.ang=opts.ang??bestAim(d.x,d.y);d.cur=d.ang;d.n=camN++;if(opts.sweep===false)d.sweep=false}
 if(type==='laser')d.orient=opts.orient||autoOrient(d.x,d.y);
 ST.cash-=DEV[type].cost;d.paid=DEV[type].cost;ST.devices.push(d);devicesChanged();AU.place();
 burst(d.x+.5,d.y+.5,10,S.accent,2,.5,.06);
 if(type==='speaker'&&!opts.noRoute)hint('Speaker fitted. During the night, click it to bluff: thieves nearby hide or turn back. Recharges in 12 s.',6);
 if(type==='guard'&&!opts.noRoute){ST.routeFor=d;ST.tool=null;hint(TOUCH?'Tap up to 6 patrol points, then press Done. No points makes a stationary sentry.':'Click up to 6 patrol points for this guard. Click the guard again, press Enter or right-click to finish. No points makes a stationary sentry.',10)}
 ST.sel=d;refreshUI();return d;
}
function sell(d){ST.devices=ST.devices.filter(o=>o!==d);ST.cash+=Math.round(d.paid*.8);if(ST.sel===d)ST.sel=null;if(ST.routeFor===d)ST.routeFor=null;devicesChanged();AU.sell();floatText(d.x+.5,d.y,'+'+money(Math.round(d.paid*.8)),S.good);refreshUI()}
let aimDrag=null;
function ptTile(e){const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;return {x,y,i:inb(Math.floor(x),Math.floor(y))?idx(Math.floor(x),Math.floor(y)):-1}}
cv.addEventListener('pointermove',e=>{const p=ptTile(e);hoverTile=p.i;hoverPt=[p.x,p.y];if(touchP&&e.pointerId===touchP.id){touchP.x=e.clientX;touchP.y=e.clientY}
 if(aimDrag){const a=Math.atan2(p.y-(aimDrag.y+.5),p.x-(aimDrag.x+.5));if(Math.hypot(p.y-(aimDrag.y+.5),p.x-(aimDrag.x+.5))>.6){aimDrag.ang=a;aimDrag.moved=true;if(aimDrag.dev){aimDrag.dev.ang=a;aimDrag.dev.cur=a}}}});

function snapTile(type,i,pt){if(i<0||canPlace(type,i))return i;let best=-1,bd=9;const x0=tx(i),y0=ty(i),px=pt?pt[0]:x0+.5,py=pt?pt[1]:y0+.5;
 for(let y=y0-2;y<=y0+2;y++)for(let x=x0-2;x<=x0+2;x++){if(!inb(x,y))continue;const j=idx(x,y);if(!canPlace(type,j))continue;const d=Math.hypot(x+.5-px,y+.5-py);if(d<1.6&&d<bd){bd=d;best=j}}return best<0?i:best}
function handlePress(p,e,touch){if(p.i<0)return;hoverTile=p.i;
 if(ST.phase==='heist'&&ST.abTool==='slam'){trySlam(p.i);return}
 if(ST.phase!=='plan'){let d=deviceAt(p.i);if(!d&&touch){for(const o of ST.devices)if(o.type==='speaker'&&Math.hypot(o.x+.5-p.x,o.y+.5-p.y)<1.3)d=o}if(d&&d.type==='speaker'&&ST.phase==='heist')fireSpeaker(d);ST.sel=d||null;refreshUI();return}
 if(ST.routeFor){const g=ST.routeFor;if(p.i===g.i){finishRoute();return}if(passable(p.i)&&G[p.i]!==OUT&&G[p.i]!==ENTRY&&g.route.length<6){g.route.push(p.i);devicesChanged();AU.click();refreshUI()}if(g.route.length>=6)finishRoute();return}

  if(ST.tool==='camera'&&canPlace('camera',i)&&!touch){aimDrag={x:tx(i),y:ty(i),i,ang:bestAim(tx(i),ty(i)),moved:false,placing:true};cv.setPointerCapture(e.pointerId);return}
  const d=place(ST.tool,i);if(d&&touch){if((d.type==='camera'||d.type==='laser')&&!ST.routeFor){ST.sel=d;ST.tool=null;hint(DEV[d.type].name+' fitted. Turn it with the buttons below, then tap Done.',4)}else if(!ST.routeFor)hint(DEV[d.type].name+' placed. Tap it to turn, upgrade or sell it.',3)}if(ST.cash<DEV[ST.tool]?.cost)ST.tool=null;refreshUI();return}

 if(!d&&touch){let bd=1.2;for(const o of ST.devices){const dd=Math.hypot(o.x+.5-p.x,o.y+.5-p.y);if(dd<bd){bd=dd;d=o}}}
 ST.sel=d||null;if(d)setMTab('build');if(d&&d.type==='camera'&&!touch){aimDrag={x:d.x,y:d.y,dev:d,ang:d.ang,moved:false};cv.setPointerCapture(e.pointerId)}
 AU.click();refreshUI();
}

function frame(now){

 if(FX.slow>0){FX.slow-=dt;FX.zoom=lerp(FX.zoom,1.35,Math.min(1,dt*6))}else FX.zoom=lerp(FX.zoom,1,Math.min(1,dt*4));

 if(ST.phase==='heist'&&ST.speed>0){let rem=dt*ST.speed*simScale;while(rem>0){const h=Math.min(rem,1/60);stepSim(h);rem-=h}

}
